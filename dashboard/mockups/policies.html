<main>

<div class="head"><h1>Policies</h1></div>

<div class="scope">
  <select aria-label="Project" style="width:170px"><option>All projects</option><option selected>backend</option><option>web-app</option></select>
  <svg class="icon" aria-hidden="true"><use href="#i-chev"/></svg>
  <select aria-label="Environment" style="width:170px"><option>All environments</option><option>development</option><option selected>production</option></select>
</div>

<form class="panel">
  <div class="settings">
    <div class="field">
      <span>.env files</span>
      <div class="modes">
        <label class="mode"><input type="radio" name="mode" value="warn"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg><b>Warn</b><span>Show a notice</span></label>
        <label class="mode"><input type="radio" name="mode" value="block"><svg class="icon" aria-hidden="true"><use href="#i-ban"/></svg><b>Block</b><span>Stop loading secrets</span></label>
        <label class="mode"><input type="radio" name="mode" value="migrate"><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg><b>Migrate</b><span>Ask to move into noenv</span></label>
        <label class="mode destructive"><input type="radio" name="mode" value="delete" checked><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg><b>Delete</b><span>Migrate, then remove</span></label>
      </div>
      <div class="reach"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>Removes .env files on 6 devices after migration.</div>
    </div>

    <div class="form-grid">
      <div class="field"><span>Match</span><div class="chips"><span class="chip">.env<button type="button" class="icon-btn" style="width:18px;height:18px" aria-label="Remove .env"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button></span><span class="chip">.env.*<button type="button" class="icon-btn" style="width:18px;height:18px" aria-label="Remove .env.*"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button></span><input aria-label="Add pattern" placeholder="Add"></div></div>
      <div class="field"><span>Ignore</span><div class="chips"><span class="chip">.env.example<button type="button" class="icon-btn" style="width:18px;height:18px" aria-label="Remove .env.example"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button></span><input aria-label="Add pattern" placeholder="Add"></div></div>
      <label class="field"><span>Minimum role</span><select><option>Reader</option><option selected>Editor</option><option>Admin</option></select></label>
    </div>
  </div>
  <div class="settings-foot"><button type="button" class="btn">Reset</button><button class="btn primary">Save</button></div>
</form>

<section>
  <h2 style="margin-top:36px">Organization</h2>
  <div class="panel">
    <ul class="kv">
      <li><span class="muted">Minimum CLI version</span><span class="mono">0.4.0</span></li>
      <li><span class="muted">Session expiry</span><span>7 days</span></li>
    </ul>
  </div>
</section>

</main>
